{% set name = "openml" %}
{% set version = "0.15.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 58ae3840b6ea736bb6c69bcbb30d587b817f64db070dc691adb9e09b99018816

build:
  number: 0
  entry_points:
    - openml = openml.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<38]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - liac-arff >=2.4.0
    - xmltodict
    - requests
    - scikit-learn >=0.18
    - python-dateutil
    - pandas >=1.0.0
    - scipy >=0.13.3
    - numpy >=1.6.2
    - minio
    - pyarrow
    - tqdm
    - packaging
    # ModuleNotFoundError: No module named 'typing_extensions'
    # https://github.com/openml/openml-python/blob/v0.15.1/openml/datasets/dataset.py#L12
    # typing_extensions must be in the run section
    - typing_extensions

test:
  imports:
    - openml
    - openml._api_calls
    - openml.base
    - openml.config
    - openml.datasets
    - openml.evaluations
    - openml.exceptions
    - openml.extensions
    - openml.extensions.sklearn
    - openml.flows
    - openml.flows.flow
    - openml.runs
    - openml.runs.trace
    - openml.setups
    - openml.study.study
    - openml.tasks
    - openml.utils
  commands:
    - pip check
    - openml --help
  requires:
    - pip

about:
  home: https://openml.org
  summary: Python API for OpenML
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  description: |
    OpenML-Python provides an easy-to-use and straightforward Python interface for OpenML,
    an online platform for open science collaboration in machine learning.
    It can download or upload data from OpenML, such as datasets and machine learning experiment results.
  dev_url: https://github.com/openml/openml-python
  doc_url: https://openml.github.io/openml-python

extra:
  recipe-maintainers:
    - BastianZim
    - mfeurer
